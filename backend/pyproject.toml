[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF012", "B904", "SIM105", "SIM108", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# Prompt text reads better unwrapped.
"apps/ai/rag/prompt_builder.py" = ["E501"]
"apps/study/prompts.py" = ["E501"]
"scripts/make_sample_pdf.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config", "tests"]
